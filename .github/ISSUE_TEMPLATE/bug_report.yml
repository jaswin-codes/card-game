name: Bug report
description: Something broke or behaved unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Create a lobby\n2. ..."
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Chrome on Android, Safari on iPhone, ...
