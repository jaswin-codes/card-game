name: Feedback or idea
description: Tell me what you liked, what confused you, or what to add
labels: [feedback]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
    validations:
      required: true
  - type: dropdown
    id: players
    attributes:
      label: How many people played?
      options: ["1 (testing alone)", "2", "3", "4", "More (spectators)"]
